<!DOCTYPE html>
<html lang="en">
<head>
    <title>Analysis Report</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <audio id="alarm" src="{{ url_for('static', filename='alarm.mp3') }}" loop></audio>

    <div class="dashboard-container">
        <header class="glass-card" style="text-align: center; margin-bottom: 24px; border-bottom: 4px solid var(--high-risk);">
            <h1 style="margin: 0; color: var(--high-risk);">⚠️ ACTIVE WILDLIFE ALERT ⚠️</h1>
            <p> ID: Cam-KL-001 | Status: Threat Detected</p>
        </header>

        <div class="glass-card" style="margin-bottom: 24px;">
            <h3 style="margin-top: 0;"> Incident Summary</h3>
            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                {% for det in detections %}
                <div style="background: rgba(0,0,0,0.3); padding: 12px 20px; border-radius: 12px; border-left: 4px solid {{ '#ef4444' if 'HIGH' in det.risk else '#f59e0b' }};">
                    <strong>{{ det.label }}</strong> | <span class="badge {{ det.css }}">{{ det.risk }}</span>
                    <br><small>Confidence: {{ det.conf }}%</small>
                </div>
                {% endfor %}
            </div>
        </div>

        <div class="analysis-row">
            <div class="glass-card">
                <h3> Visual Evidence</h3>
                <img src="{{ url_for('static', filename='result.jpg') }}" class="evidence-img">
            </div>

            <div class="glass-card">
                <h3>📍 Incident Location</h3>
                <div id="map"></div>
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 10px;">Coordinates: 10.178111° N, 76.431325° E</p>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px;">
            <button onclick="stopAlarm()" class="upload-btn" style="background: #475569;">STOP ALARM</button>
            <a href="/reset"><button class="upload-btn" style="background: #dc2626;">SYSTEM RESET</button></a>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        
const asietLat = 10.178111;
const asietLng = 76.431325;

// Initialize map centered exactly on the campus
var map = L.map('map', {
    center: [asietLat, asietLng],
    zoom: 17,
    zoomControl: true
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

// Custom Marker for the Monitoring Station
var stationIcon = L.circle([asietLat, asietLng], {
    color: '#ef4444',
    fillColor: '#ef4444',
    fillOpacity: 0.5,
    radius: 30
}).addTo(map);

L.marker([asietLat, asietLng]).addTo(map)
    .bindPopup(`
        <div style="color:black; font-family: sans-serif;">
            <b style="font-size: 14px;"></b><br>
            <span style="color: #ef4444; font-weight: bold;">🚨 DETECTION ALERT</span><br>
            Targets: {{ names }}
        </div>
    `)
    .openPopup();

const alarm = document.getElementById('alarm');
        window.onload = () => {
            alarm.play().catch(() => {
                document.body.addEventListener('click', () => { alarm.play(); }, {once: true});
            });
        };

        function stopAlarm() { alarm.pause(); alarm.currentTime = 0; }
    </script>
</body>
</html>
